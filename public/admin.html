<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel privado | KVINX WORLD</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="page"><header class="hero"><div class="eyebrow">ÁREA RESTRITA</div><h1 class="brand">KVINX <span>WORLD</span></h1><p class="subtitle">Painel privado de inscrições</p></header>
<section class="panel"><div class="section-kicker">ADMIN / INSCRIÇÕES</div><h2>Painel do <span>responsável.</span></h2><p class="intro">Entre com a senha administrativa configurada no servidor. Não compartilhe esta página como se fosse pública.</p>
<form id="loginForm"><div class="field"><label for="password">Senha administrativa</label><input id="password" type="password" autocomplete="current-password" required placeholder="Digite a senha do painel"></div><button class="submit-button" type="submit">ENTRAR NO PAINEL <span>→</span></button></form>
<div id="adminMessage" class="message" role="status"></div>
<div id="recordsArea" hidden><div class="quick-links" style="justify-content:flex-start;margin:25px 0"><button id="refresh" class="action-button" type="button">Atualizar lista</button><button id="export" class="action-button" type="button">Exportar CSV</button><button id="logout" class="action-button" type="button">Sair</button></div><p id="count" class="hint"></p><div id="records"></div></div>
</section><footer><span class="footer-mark">KW</span><span>KVINX WORLD</span><span class="footer-line"></span><a href="/" style="color:#aaa;text-decoration:none">Voltar ao site</a></footer></main>
<script>
const form=document.querySelector('#loginForm'), msg=document.querySelector('#adminMessage'), area=document.querySelector('#recordsArea');
function say(t,type='error'){msg.textContent=t;msg.className='message show '+type}
async function load(){const r=await fetch('/api/admin/registrations');if(!r.ok){area.hidden=true;say('Sessão expirada ou não autenticada. Entre novamente.');return}const rows=await r.json();area.hidden=false;msg.className='message';document.querySelector('#count').textContent=rows.length+' inscrição(ões) registrada(s).';const target=document.querySelector('#records');target.replaceChildren();if(!rows.length){target.textContent='Ainda não há inscrições.';return}const table=document.createElement('table');table.style.cssText='width:100%;border-collapse:collapse;font-size:12px';const head=document.createElement('tr');['Usuário','Discord','Disposto a falar','Data (UTC)'].forEach(t=>{const th=document.createElement('th');th.textContent=t;th.style.cssText='text-align:left;padding:10px 5px;border-bottom:1px solid #49323a;color:#ff7783';head.append(th)});table.append(head);rows.forEach(x=>{const tr=document.createElement('tr');[x.username,'Sim',x.willingToTalk?'Sim':'Não',new Date(x.createdAt).toLocaleString('pt-BR',{timeZone:'UTC'})].forEach(t=>{const td=document.createElement('td');td.textContent=t;td.style.cssText='padding:10px 5px;border-bottom:1px solid #292329;overflow-wrap:anywhere';tr.append(td)});table.append(tr)});target.replaceChildren(table)}
form.addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.querySelector('#password').value})});const d=await r.json();if(!r.ok)return say(d.error||'Falha ao entrar.');say('Acesso autorizado.','success');await load()});
document.querySelector('#refresh').addEventListener('click',load);
document.querySelector('#export').addEventListener('click',()=>{window.location.href='/api/admin/export.csv'});
document.querySelector('#logout').addEventListener('click',async()=>{await fetch('/api/admin/logout',{method:'POST'});area.hidden=true;form.reset();say('Você saiu do painel.','success')});
</script></body></html>
